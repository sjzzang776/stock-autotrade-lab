<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}투자 현황{% endblock %} · 주식자동매매</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header><nav class="nav">
  <span class="brand">주식자동매매</span>
  <a class="tab {{ 'on' if active == 'overview' }}" href="/">전체 현황</a>
  {% for k, m in markets.items() %}<a class="tab {{ 'on' if active == k }}" href="/market/{{ k }}">{{ m.name }}</a>{% endfor %}
  <a class="tab {{ 'on' if active == 'paper' }}" href="/paper">모의투자</a>
  <a class="tab {{ 'on' if active == 'strategy' }}" href="/strategy">투자 전략</a>
  <a class="tab {{ 'on' if active == 'backtest' }}" href="/backtest">백테스트</a>
</nav></header>
<nav class="toc" id="toc" hidden></nav>
<main>{% block body %}{% endblock %}</main>
<script>
// 페이지 안 소제목(카드의 h2·구역 이름표)으로 바로가기 줄을 자동으로 만듦 (2026-10-20 사용자 요청)
document.addEventListener('DOMContentLoaded', () => {
  const heads = [...document.querySelectorAll('main .sec-tag, main .card > h2, main .card > div > h2, main > h2')]
    .filter(h => h.textContent.trim() && h.offsetParent !== null);
  if (heads.length < 3) return;
  const toc = document.getElementById('toc');
  const used = new Set();
  toc.innerHTML = '<div class="toc-in">' + heads.map((h, i) => {
    const label = (h.childNodes[0] ? h.childNodes[0].textContent : h.textContent).trim().replace(/\s+/g, ' ').slice(0, 24);
    if (!label || used.has(label)) return '';
    used.add(label);
    const target = h.closest('.card') && !h.classList.contains('sec-tag') ? h.closest('.card') : h;
    target.id = target.id || 'sec-' + i;
    return `<a href="#${target.id}" class="${h.classList.contains('sec-tag') ? 'major' : ''}">${label}</a>`;
  }).join('') + '</div>';
  toc.hidden = false;
});
</script>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
Chart.defaults.font.size = 14; Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
function lineChart(el, labels, sets) {
  return new Chart(el, { type: 'line',
    data: { labels, datasets: sets.map(s => ({ label: s.label, data: s.data, borderColor: css(s.color),
      backgroundColor: css(s.color), borderWidth: s.width || 2.5, pointRadius: 0, tension: 0.1, borderDash: s.dash || [] })) },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: css('--muted'), font: { size: 15 }, boxWidth: 18 } } },
      scales: { x: { ticks: { color: css('--muted'), maxTicksLimit: 8 }, grid: { color: css('--line') } },
                y: { ticks: { color: css('--muted') }, grid: { color: css('--line') } } } } });
}
</script>
{% block script %}{% endblock %}
</body>
</html>
